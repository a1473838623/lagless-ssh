name: Desktop and terminal packages (Windows)
# Started by hand for a release only, to save Actions minutes. Linux and macOS
# packages and the test suite are paused; run the tests locally before a release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official fixed Oracle JDK 25.0.5.0.2
        shell: pwsh
        run: ./scripts/install-release-jdk.ps1
      - name: Package terminal and desktop runtimes (tests skipped)
        shell: pwsh
        run: ./scripts/build-dist.ps1 -Edition both
      - uses: actions/upload-artifact@v4
        with:
          name: lagless-windows-latest
          path: |
            dist/*.zip
            dist/*.jar
