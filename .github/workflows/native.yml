name: Native desktop (Windows)
# Started by hand for a release only, to save Actions minutes. The Linux native
# build and unit tests are paused. The JVM run that records the Native Image
# reflection metadata still runs: without it the EXE can fail at startup.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hash-pinned patched Oracle GraalVM
        shell: pwsh
        run: ./scripts/install-native-graalvm.ps1
      - name: Require patched official Oracle GraalVM
        shell: pwsh
        run: . ./scripts/release-jdk.ps1; Get-ReleaseJdk | ConvertTo-Json -Depth 8
      - name: Windows native build (unit tests and final EXE checks skipped)
        shell: pwsh
        run: ./scripts/build-native.ps1 -SkipUnitTests -SkipNativeChecks
      - uses: actions/upload-artifact@v4
        with:
          name: lagless-native-windows-latest
          path: dist/lagless-desktop-native-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics-windows-latest
          path: |
            desktop/target/native/*report.json
            desktop/target/native/metadata/
