name: Native desktop (Windows)
# Started by hand for a release only, to save Actions minutes. The Linux native
# build and unit tests are paused. The JVM run that records the Native Image
# reflection metadata still runs: without it the EXE can fail at startup.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hash-pinned patched Oracle GraalVM
        shell: pwsh
        run: ./scripts/install-native-graalvm.ps1
      - name: Require patched official Oracle GraalVM
        shell: pwsh
        run: . ./scripts/release-jdk.ps1; Get-ReleaseJdk | ConvertTo-Json -Depth 8
      - name: Windows native build (unit tests and final EXE checks skipped)
        shell: pwsh
        run: ./scripts/build-native.ps1 -SkipUnitTests -SkipNativeChecks
      # ~30 s: the version check of the finished EXE, with gh removed from PATH as on most PCs.
      # Starting a missing gh crashed the EXE in VCRUNTIME140.dll before rc.8.17 was rebuilt.
      - name: Update check of the finished EXE (no gh on PATH)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/lagless-desktop-native-*.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath smoke -Force
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'gh.exe')) }) -join ';'
          $p = Start-Process -FilePath smoke/Lagless.exe -ArgumentList '--check-update' -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) { throw "Update check exited with code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: lagless-native-windows-latest
          path: dist/lagless-desktop-native-*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics-windows-latest
          path: |
            desktop/target/native/*report.json
            desktop/target/native/metadata/
